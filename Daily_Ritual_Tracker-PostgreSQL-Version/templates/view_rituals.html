{% extends 'base.html' %} {%block content%}
<div class="mt-3">
  <h1>Rituals table</h1>
  <div class="table-responsive">
    <table class="table table-sm">
      <thead>
        <tr>
          <th scope="col">Date</th>
          <th scope="col">Begin Time</th>
          <th scope="col">Finish Time</th>
          <th scope="col">Comment</th>
        </tr>
      </thead>
      <tbody>
        {% for ritual in rituals %}
        <tr>
          <td>
            {{ ritual.date }}
            <a
              href="{{ url_for('edit_ritual', ritual_id=ritual.id) }}"
              class="btn btn-info btn-sm"
              >Edit</a
            >
          </td>
          <td>{{ ritual.begin_time }}</td>
          <td>{{ ritual.finish_time }}</td>
          <td>{{ ritual.comment }}</td>
          <td>
            <a
              href="{{ url_for('delete_ritual', ritual_id=ritual.id) }}"
              class="btn btn-danger btn-sm"
              >Delete</a
            >
          </td>
        </tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
</div>
{%endblock%}
